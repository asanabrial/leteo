name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      # `-c` because `cargo about` reads `about.toml` from the working
      # directory and both it and the template live beside this workflow now.
      - run: cargo about generate --all-features --locked --fail -c .github/licenses/about.toml -o THIRD_PARTY_LICENSES.html .github/licenses/about.hbs
      - uses: actions/upload-artifact@v6
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.html

  build:
    needs: licenses
    strategy:
      matrix:
        include:
          # The two Linux builds pin an Ubuntu rather than taking `latest`,
          # because on glibc the build host chooses who can run the result: a
          # binary links the versioned symbols of the glibc it was built
          # against and runs on that version or newer, never older.
          #
          # `ubuntu-latest` became 24.04, so v0.1.0 asked for GLIBC 2.38 and
          # 2.39 and would not start on Debian 12 or Ubuntu 22.04 — current
          # Debian stable, and an Ubuntu supported into 2027. Measured on
          # `debian:12`: "version `GLIBC_2.38' not found", after the archive
          # had downloaded and extracted perfectly. Nobody chose that floor; it
          # moved when GitHub moved the label, and it would have moved again.
          #
          # 22.04 carries glibc 2.35, and the binary built there turns out to
          # ask for no more than 2.34 — measured with `objdump -T`, then run:
          # `leteo --version` answers on Rocky Linux 9 (2.34), Ubuntu 22.04
          # (2.35) and Debian 12 (2.36), the last being where the released
          # binary refuses to start. Pinned, so the next move of that floor is
          # a commit somebody makes rather than a Tuesday.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: leteo
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: leteo.exe
            archive: zip
          # Intel macOS, built on an Apple Silicon runner. `macos-13` is the
          # last Intel image GitHub offers and it is on the way out, so its
          # pool is small: the other four targets finished in 3.5 to 8.5
          # minutes while this one sat fourteen without ever being given a
          # runner. Nothing about the binary needs an Intel host — Xcode's SDK
          # carries both architectures, so clang and the `cc` crate cross-
          # compile it from arm64 the same way they would build it natively.
          - os: macos-latest
            target: x86_64-apple-darwin
            executable: leteo
            archive: tar.gz
          # Apple Silicon is the default Mac, and arm64 servers are ordinary
          # now; without these two the installer has nothing to offer them.
          - os: macos-latest
            target: aarch64-apple-darwin
            executable: leteo
            archive: tar.gz
          # The sibling of the note above, and the reason it is a note rather
          # than a one-line change: arm64 Linux had the same floor for the same
          # reason, and fixing only the target somebody happened to report
          # would have left half the Linux users where they were.
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            executable: leteo
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/download-artifact@v7
        with:
          name: third-party-licenses
          path: licenses
      - name: Stage release archive
        shell: bash
        run: |
          set -euo pipefail
          package="leteo-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$package"
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/$package/"
          cp LICENSE NOTICE README.md CHANGELOG.md .github/SECURITY.md licenses/THIRD_PARTY_LICENSES.html "dist/$package/"
          # The uninstaller ships inside the archive because the installer
          # copies it out beside the binary. Left out, `install.ps1` finds no
          # `uninstall.ps1`, skips registering Leteo in Installed apps, and
          # says nothing about it — the install still works, so nobody learns
          # that removing it quietly stopped being possible from Settings.
          cp uninstall.ps1 uninstall.sh "dist/$package/"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd dist && 7z a "$package.zip" "$package")
          else
            tar -C dist -czf "dist/$package.tar.gz" "$package"
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: leteo-${{ matrix.target }}
          path: dist/leteo-*.${{ matrix.archive }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # `--verify-tag` below shells out to git, and a job that only downloads
      # artifacts has no repository to shell out in: it failed with "fatal: not
      # a git repository". Checking out is the fix rather than dropping the
      # flag, because the flag is the thing that refuses to publish a release
      # for a tag nobody pushed.
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: leteo-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag

  # Container image for the optional cloud service. The local product ships as
  # a plain binary and needs no image.
  container:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
