name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Debug info is most of what a test build links, and nothing here reads a
  # backtrace symbol. Set as an environment variable rather than in Cargo.toml
  # so a local `cargo test` keeps its debugger.
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

# Every job below gates a merge, and none of them is report-only. `main`
# requires one status check for every matrix leg and one for every job that is
# not a matrix, with `enforce_admins` on, so a red one blocks the pull request
# instead of sitting in it as advice. The count lives in the note on
# `unit-tests` rather than here, because it changes whenever this file gains a
# leg or a job.
#
# Until #48 protection listed only the `unit-tests` legs, which left
# `cloud-tests` and `container-images` running on every pull request and unable
# to stop one. What each of them is for is argued where it lives, in the comment
# above the job itself; it is not restated here, because a fact written twice is
# a fact that gets edited once.
#
# Requiring them was measured rather than assumed: a check that flakes turns
# somebody else's outage into a blocked repository, and both of these reach
# outside the runner. The count is per ATTEMPT, not per run, which is the part
# that makes it mean anything — GitHub reports a run's conclusion from its
# latest attempt, so a job that failed and was re-run to green reads as
# `success` at run level, and re-running is precisely what one does to a flake.
# Counting runs would have hidden the thing being looked for.
#
# Census as of 2026-08-24T02:12Z, over every run of this workflow on every
# branch and event: list `/actions/workflows/ci.yml/runs`, then read
# `/actions/runs/{id}/attempts/{n}/jobs` for each attempt. A job counts as
# failed on any conclusion that is not `success`, so `cancelled`, `timed_out`
# and `startup_failure` are included — the last one matters here, because it is
# how a `services:` container or a buildx cache problem surfaces, and it blocks
# a merge exactly as a `failure` does. None of the three occurs.
#
# 99 runs, 102 attempts. The three extra attempts are accounted for: one is the
# retry below, and two are deliberate re-runs of an already-green run, made
# while measuring runner queue times for #45.
#
#   job                attempts   failures
#   cloud-tests             102          0   since the first commit
#   container-images         88          0   since it was added
#   unit-tests              102          1   attempt 1 of run 31601355516,
#                                            green on attempt 2 of the same
#                                            commit
#
# `attempts` counts workflow attempts in which the job ran, not job records:
# `unit-tests` is a matrix, so the jobs endpoint returns one record per leg and
# this row would be correspondingly larger counted that way. Attempts is the
# unit that answers the question being asked — whether this job has ever stopped
# a merge — and it is the same unit for all three rows.
#
# So the only flake this WORKFLOW has recorded is in a job that has been
# blocking merges all along, and the two added by #48 have a clean attempt-level
# record. Scope that deliberately: `release.yml` and `publish-registries.yml`
# were not counted, and three of their runs have failed.
#
# Read it with its limit. The runs fall on five active days and 57 of them are
# one of them; `container-images` is narrower still, its whole sample sitting in
# the last three. Pool pressure and service-container availability vary by hour
# and day, and a fortnight concentrated into five of them does not sample that.
# By the rule of three, zero failures bounds each job's rate separately — 2.9%
# for `cloud-tests` at 102 attempts, 3.4% for `container-images` at 88 — and the
# younger job is the looser bound, which is the direction worth remembering. It
# establishes the absence of a reproducible flake, which is the failure mode
# that would make requiring these a mistake, and not more.
#
# `container-image-arm64` is required from #58 with no attempt history at all,
# which is a weaker warrant than any row above and is written down rather than
# glossed: a census cannot bound the failure rate of a job that has never run.
# It was required anyway, because the alternative is a job that can report an
# arm64 break without being able to stop one, and stopping it before the tag is
# the whole reason it exists. Whoever reads this census next can count it.
#
# The required contexts are a function of what is in this file, but nothing here
# updates them: protection is configured out of band, by hand. Adding a job or a
# matrix leg means adding a context yourself — see the note on `unit-tests` for
# what happens when the list and the workflow disagree.
jobs:
  unit-tests:
    # Renaming this job renames the checks that branch protection requires, and
    # a matrix renames them whether you ask or not: GitHub appends the matrix
    # values, so `Unit Tests` became `Unit Tests (ubuntu-latest)` and its
    # siblings. `main` required the old name with `enforce_admins` on, which
    # made every pull request unmergeable the moment that landed — green, and
    # BLOCKED, because the required check could no longer be produced by
    # anything.
    #
    # Protection therefore lists one context per leg of this matrix plus one
    # for each job that is not a matrix, and the count is part of the trap: #42
    # set it to three, #45 added `ubuntu-22.04-arm` for four, #48 brought
    # `cloud-tests` and `container-images` in for six, and #58 added the arm64
    # container job for seven. Whoever changes the matrix next changes the
    # required checks with it, whether or not they touch this line.
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Without this, the first leg to go red cancels every other leg, so one
      # push shows one platform's failures and the next platform's are only
      # found after that one is fixed. The whole point of the matrix is to see
      # all of it at once, and serialising the discovery is what turns a
      # cross-platform fix into one round per platform. The `os:` list owns how
      # many that is; this sentence deliberately does not.
      fail-fast: false
      matrix:
        # Four runners against five released targets. `macos-latest` is an
        # Apple Silicon image — `release.yml` says so in its own comment and
        # depends on it — so the macOS leg is the `aarch64-apple-darwin` host
        # triple and tests that target natively.
        #
        # What ships without ever being executed is now one target, not two:
        #
        #   x86_64-apple-darwin      built on `macos-latest` by cross-compiling
        #                            from arm64 (`release.yml`, the note about
        #                            `macos-13` being the last Intel image and
        #                            its pool too small to wait on). Nothing
        #                            runs it, here or there, and adding the
        #                            runner that would means re-adopting the
        #                            image that measurement rejected.
        #
        # Covering a target is two separate claims — the triple, and the host
        # that built the shipped artifact — and they come apart in exactly one
        # place here. Against `release.yml`'s build matrix:
        #
        #   ubuntu-22.04-arm   aarch64-unknown-linux-gnu   same host
        #   macos-latest       aarch64-apple-darwin        same host
        #   windows-latest     x86_64-pc-windows-msvc      same host
        #   ubuntu-latest      x86_64-unknown-linux-gnu    NOT the same host
        #
        # So three of the four legs test on the host that builds what ships,
        # and `ubuntu-latest` is the single exception rather than the arm leg
        # being the single match. `release.yml` pins both of its Linux images —
        # `ubuntu-22.04` and `ubuntu-22.04-arm` — because on glibc the build
        # host sets the floor for who can run the result, after `ubuntu-latest`
        # moved to 24.04 and shipped a v0.1.0 that would not start on Debian
        # 12. This matrix matches the arm pin and not the x86-64 one, so that
        # floor is the half it does not cover. Both Linux targets shipped 0.1.0
        # with the raised floor — `release.yml` says so beside the arm entry,
        # and 0.1.1 pinned both — so the uncovered half is the one that was
        # reported, not the only one that broke.
        #
        # `ubuntu-latest` is left floating deliberately: pinning it as well
        # would close the gap and leave no Linux leg on a moving image. That is
        # a separate trade with its own measurement rather than a free win to
        # fold in.
        #
        # What the matrix buys beyond that is the file handling: `src/setup/`
        # writes into other tools' configuration and `src/setup/removal/` takes
        # it back out, and where those files live and how paths inside them are
        # spelled is decided per operating system rather than per architecture.
        os: [ubuntu-latest, ubuntu-22.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # A failing run saves its cache too. Without this a red run leaves
          # nothing behind, so the fix pushed after it recompiles the whole
          # dependency tree, on every red run rather than once. The reason
          # stands on the mechanism. An earlier version of this note also
          # counted how often it had bitten, and that count was not one this
          # repository's own history could show.
          cache-on-failure: true
      # `--locked`, because the release workflow builds that way. Without it CI
      # can resolve a newer dependency set than the one that ships, and "it
      # passed CI" stops meaning what it appears to mean.
      - run: cargo test --locked

  # Not on the matrix above, and not a trade-off that was weighed: this job
  # needs the `services:` block below, and GitHub runs service containers on
  # Linux runners only. There is no macOS or Windows version of this job to
  # decline.
  #
  # The analogue of an end-to-end suite: these need a real PostgreSQL, so
  # `cargo test` skips them and the job above goes green without the behavioural
  # half of multi-tenant isolation, the fail-closed project allowlist, chunk
  # forgery, or token revocation. Those are the parts of Leteo where a
  # regression is worst.
  #
  # The behavioural half, precisely: some of that ground is covered structurally
  # without a service, and saying otherwise reads as though nothing guards it.
  # `cloudstore/tests.rs` checks that every query narrows to its tenant by
  # reading the source, and `auth.rs` splits the no-project refusal out so an
  # unconditional test can reach it. What no unconditional test can do is run
  # any of it against a real database, which is what the tests carrying
  # `#[ignore = "requires TEST_DATABASE_URL ..."]` need, and what this job
  # exists to run.
  #
  # What those tests cover is not summarised here. Every summary this comment
  # has carried turned out narrower than the set it described, and a list that
  # must be re-counted whenever a test is added is the same trap as a hard-coded
  # leg count. `cargo test -- --ignored` is the list.
  cloud-tests:
    name: Cloud Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: leteo-test
          POSTGRES_DB: leteo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test --locked -- --ignored
        env:
          TEST_DATABASE_URL: postgres://postgres:leteo-test@127.0.0.1:5432/leteo_test

  # Not on the matrix above either, for the same kind of reason: the images are
  # Linux images, so a Windows or macOS runner would either fail to build them
  # or build the same Linux artifact more slowly.
  #
  # Both images, built and one of them run. The cloud image was once
  # unbuildable for want of the `migrations` directory that `include_str!`
  # needs — `docker/Dockerfile` carries the exact error. That predates this
  # repository: the fix has been in the file since the first commit, so the
  # story is inherited and the duration is not one this history can show.
  # `release.yml` does build this image on every tag, so the lesson is narrower
  # than nobody building it: an image built only at release time tells you it is
  # broken at the moment you are least able to act. That is why this job builds
  # both images on every pull request instead. Building is not enough on its own
  # either: what the MCP directories check, and what a user actually needs, is
  # that the container starts and answers. So this one is asked for its tools.
  #
  # Both images, on one architecture. This runner is x86-64 and neither build
  # below names a platform, so what it produces of `docker/Dockerfile` is the
  # amd64 half; `container-image-arm64` builds the other one.
  container-images:
    name: Container Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.mcp
          load: true
          tags: leteo-mcp:ci
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp
      # An MCP handshake, then the question every client asks first. `timeout`
      # rather than trust: a server that never answers would otherwise hold the
      # job until the runner's own limit killed it, six hours later.
      - name: The MCP image answers on stdio
        run: |
          set -o pipefail
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | timeout 120 docker run --rm -i leteo-mcp:ci > handshake.json
          cat handshake.json
          grep -q '"serverInfo"' handshake.json
          grep -q '"mem_search"' handshake.json
      # This build's cache scope is the one `release.yml`'s amd64 leg reads, so
      # a release can start from what a `main` run already built rather than
      # from cold. Can, not will: `docker/Dockerfile` has no dependency-only
      # layer — the sources are copied in, then one `cargo build` — so it is
      # reused only when the tagged tree matches one a `main` run already built.
      # A tag on a commit CI has run is the ordinary case; anything else falls
      # back to the base image and apt layers, which is part of the saving
      # rather than the whole of it. How large a part is unmeasured. #14 gave
      # the release matrix `scope=${{ matrix.platform }}` because two
      # architectures sharing one scope evict each other, and this job was
      # left on buildx's default — so from then until #59 the amd64 halves never
      # met and every release recompiled `cargo build --release` from nothing on
      # that leg. The arm64 leg stopped paying it at #58, which gave the job
      # below `scope=linux/arm64`.
      #
      # And the MCP image above gets a scope of its own, so that this build's
      # scope holds one Dockerfile's layers and nothing else. Calling that the
      # #14 eviction one level down would be more than is known: these two
      # Dockerfiles have identical build stages today, which is the case where
      # sharing a scope shares rather than evicts. It is unmeasured either way,
      # and the reason to separate them is that a scope nobody named is one
      # nobody can reason about — the state this whole issue came out of.
      #
      # It is not free, and this is the bound that runs the other way: three
      # `mode=max` scopes where there was one, two of them holding that same
      # compile stage, against a per-repository cache budget with LRU eviction.
      # The entry that would be evicted is the one this job exists to keep warm.
      # Also unmeasured; the split is kept for legibility, not against a number.
      #
      # What this buys is bounded by whose cache it is. GitHub scopes a cache
      # entry to the ref that wrote it, and a tag build reads the default
      # branch's, not a pull request's — so it is the `push: branches: [main]`
      # run of this workflow that pays for the release, and a pull request pays
      # only for its own later runs.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,mode=max,scope=linux/amd64

  # The half of the published image that used to be built first at tag time.
  # Since #14 the release publishes `docker/Dockerfile` for `linux/amd64` and
  # `linux/arm64`; the job above builds only the first, which left the second
  # in exactly the position that job's own comment rejects for the image as a
  # whole. An arm64-only break — a base tag missing that platform, a package
  # with no arm64 candidate, a compile that exhausts the runner — would have
  # surfaced during the release, after `publish` had already created the GitHub
  # release, and `container-manifest` needs every leg, so no image tag would be
  # written at all.
  #
  # `docker/Dockerfile` is architecture-neutral as it stands: no `--platform`,
  # no target triple, no architecture-specific package, and an unsuffixed
  # `target/release/leteo` to copy out. So this job is here to keep a latent
  # problem latent rather than to fix a present one.
  #
  # A native runner rather than QEMU, for the reason `release.yml` already gives
  # beside its own container matrix: this Dockerfile runs a full
  # `cargo build --release`, and a long CPU-bound compile is the worst case for
  # user-mode emulation rather than a file copy. Emulating an architecture that
  # the release builds natively would also be answering one question two ways,
  # which is the argument that file makes against the shorter shape.
  #
  # This job's cache scope is the one `release.yml`'s arm64 leg reads, which is
  # what #58 gave it and #59 then gave the amd64 build beside it. What sharing
  # buildx's default cost is answered above for these two: from #14 until #59
  # the amd64 halves never met and every release recompiled
  # `cargo build --release` on that leg. What that comment declines is the
  # narrower question beside it — whether the MCP image and this one, whose
  # build stages are identical today, would share a scope or evict each other
  # — and this sentence does not answer that either.
  #
  # Nothing is pushed from here either. The release remains the only thing that
  # publishes.
  container-image-arm64:
    name: Container Image (arm64)
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      # `platforms:` names what this runner would have built anyway. It is
      # written out so the job states its own contract instead of inheriting it
      # from the `runs-on` label, which is the half of that pair somebody
      # editing this file is free to change without noticing the other.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          cache-from: type=gha,scope=linux/arm64
          cache-to: type=gha,mode=max,scope=linux/arm64
