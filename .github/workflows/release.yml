name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The changelog's newest section carries the word "unreleased" from the
      # moment it is written until somebody dates it, and the only moment that
      # matters is this one — a tag is pushed and the section describing it
      # still says it has not happened. Nothing would notice: the release would
      # publish, and the file it points people at would disagree with it.
      #
      # It runs before `cargo about` and before five binaries are built, so the
      # thing that fails is the cheapest job rather than the twelfth minute.
      - name: The changelog names this release, and dates it
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## \[${version}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [${version}] - YYYY-MM-DD' section."
            echo "It currently opens with:"
            grep -m1 '^## ' CHANGELOG.md
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      # `-c` because `cargo about` reads `about.toml` from the working
      # directory and both it and the template live beside this workflow now.
      - run: cargo about generate --all-features --locked --fail -c .github/licenses/about.toml -o THIRD_PARTY_LICENSES.html .github/licenses/about.hbs
      - uses: actions/upload-artifact@v6
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.html

  build:
    needs: licenses
    strategy:
      matrix:
        include:
          # The two Linux builds pin an Ubuntu rather than taking `latest`,
          # because on glibc the build host chooses who can run the result: a
          # binary links the versioned symbols of the glibc it was built
          # against and runs on that version or newer, never older.
          #
          # `ubuntu-latest` became 24.04, so v0.1.0 asked for GLIBC 2.38 and
          # 2.39 and would not start on Debian 12 or Ubuntu 22.04 — current
          # Debian stable, and an Ubuntu supported into 2027. Measured on
          # `debian:12`: "version `GLIBC_2.38' not found", after the archive
          # had downloaded and extracted perfectly. Nobody chose that floor; it
          # moved when GitHub moved the label, and it would have moved again.
          #
          # 22.04 carries glibc 2.35, and the binary built there turns out to
          # ask for no more than 2.34 — measured with `objdump -T`, then run:
          # `leteo --version` answers on Rocky Linux 9 (2.34), Ubuntu 22.04
          # (2.35) and Debian 12 (2.36), the last being where the released
          # binary refuses to start. Pinned, so the next move of that floor is
          # a commit somebody makes rather than a Tuesday.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: leteo
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: leteo.exe
            archive: zip
          # Intel macOS, built on an Apple Silicon runner. `macos-13` is the
          # last Intel image GitHub offers and it is on the way out, so its
          # pool is small: the other four targets finished in 3.5 to 8.5
          # minutes while this one sat fourteen without ever being given a
          # runner. Nothing about the binary needs an Intel host — Xcode's SDK
          # carries both architectures, so clang and the `cc` crate cross-
          # compile it from arm64 the same way they would build it natively.
          - os: macos-latest
            target: x86_64-apple-darwin
            executable: leteo
            archive: tar.gz
          # Apple Silicon is the default Mac, and arm64 servers are ordinary
          # now; without these two the installer has nothing to offer them.
          - os: macos-latest
            target: aarch64-apple-darwin
            executable: leteo
            archive: tar.gz
          # The sibling of the note above, and the reason it is a note rather
          # than a one-line change: arm64 Linux had the same floor for the same
          # reason, and fixing only the target somebody happened to report
          # would have left half the Linux users where they were.
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            executable: leteo
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/download-artifact@v7
        with:
          name: third-party-licenses
          path: licenses
      - name: Stage release archive
        shell: bash
        run: |
          set -euo pipefail
          package="leteo-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$package"
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/$package/"
          cp LICENSE NOTICE README.md CHANGELOG.md .github/SECURITY.md licenses/THIRD_PARTY_LICENSES.html "dist/$package/"
          # The uninstaller ships inside the archive because the installer
          # copies it out beside the binary. Left out, `install.ps1` finds no
          # `uninstall.ps1`, skips registering Leteo in Installed apps, and
          # says nothing about it — the install still works, so nobody learns
          # that removing it quietly stopped being possible from Settings.
          cp scripts/uninstall.ps1 scripts/uninstall.sh "dist/$package/"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd dist && 7z a "$package.zip" "$package")
          else
            tar -C dist -czf "dist/$package.tar.gz" "$package"
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: leteo-${{ matrix.target }}
          path: dist/leteo-*.${{ matrix.archive }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # `--verify-tag` below shells out to git, and a job that only downloads
      # artifacts has no repository to shell out in: it failed with "fatal: not
      # a git repository". Checking out is the fix rather than dropping the
      # flag, because the flag is the thing that refuses to publish a release
      # for a tag nobody pushed.
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: leteo-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag

  # Container image for the optional cloud service. The local product ships as
  # a plain binary and needs no image.
  #
  # Each architecture on a runner of its own, and a manifest joining them
  # afterwards. The shorter answer is one runner with QEMU and a `platforms:`
  # line, and it was not taken for a reason this file already records: the
  # binary matrix above builds `aarch64-unknown-linux-gnu` on `ubuntu-22.04-arm`
  # rather than cross-compiling it, because arm64 Linux needed a native host.
  # Emulating that same architecture, in the same file as the decision not to
  # cross-compile it, would contradict that decision.
  #
  # What it costs is this shape — a matrix that pushes by digest and a second
  # job to merge them — against a QEMU step and one `platforms:` line. What it
  # buys is that neither half of the image is built under emulation, which
  # matters here more than it would for most images because `docker/Dockerfile`
  # runs a full `cargo build --release`: a long CPU-bound compile is the worst
  # case for user-mode emulation, not a file copy.
  container:
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      # So that a failing leg does not cancel the other mid-push, and so one
      # run says whether one architecture broke or both. Either setting can
      # leave the surviving architecture's digest in the registry belonging to
      # no tag: `container-manifest` needs every leg, so a failed matrix skips
      # the merge and no tag is ever written, but the pushed blob is there
      # until it is pruned. That is the accepted cost of finding out about both
      # failures at once, not something this line prevents.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-22.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Here for `labels:` alone — the tags belong to the merge. An earlier
      # draft of this change moved the whole `metadata-action` step down to the
      # merge along with the tags, which silently stopped the image carrying any
      # `org.opencontainers.image.*` label: `imagetools create` builds an index
      # over manifests that already exist and cannot write into their configs,
      # and `docker/Dockerfile` has no `LABEL` of its own to fall back on. The
      # first of those labels, `.source`, is what GHCR reads to link a package
      # to this repository.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
      # Pushed by digest rather than by tag, because two jobs writing the same
      # tag would leave whichever finished last as the whole image and the other
      # architecture unreachable. The tags are applied once, by the merge.
      - id: built
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      # The file is named for the digest, which is what the merge assembles;
      # its contents are the platform, which is what the merge then checks it
      # published. The upload cannot be named for the platform, however much
      # that would read better, because `linux/amd64` contains a `/` and an
      # artifact name may not — hence the matrix index.
      - name: Hand the digest and its platform to the merge
        run: |
          set -o pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.built.outputs.digest }}"
          test -n "$digest"
          echo "${{ matrix.platform }}" > "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v6
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The tags live here and nowhere else, so a half-finished matrix publishes no
  # tag at all rather than a tag that means one architecture.
  container-manifest:
    needs: container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # No guard on the digests being there. `needs: container` is satisfied
      # only when every leg succeeded, and every leg's upload carries
      # `if-no-files-found: error`, so this job does not start with the
      # directory empty. An earlier draft refused the empty set here and
      # reported that every leg had failed — a sentence describing the case in
      # which this job is skipped rather than run.
      - name: Join the architectures under the release tags
        working-directory: /tmp/digests
        run: |
          set -o pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
      # Asked rather than assumed: `imagetools create` succeeds on a single-
      # architecture list, so what the manifest ends up holding is the only
      # thing that distinguishes this change from the one it replaces.
      #
      # The architectures come from the files the matrix wrote rather than from
      # a list repeated here. Written out, this step would keep checking the
      # old two after somebody added a third to the matrix, and pass — which is
      # the failure it exists to catch.
      - name: The published tag names every architecture that was built
        working-directory: /tmp/digests
        run: |
          set -o pipefail
          version="${GITHUB_REF_NAME#v}"
          manifest=$(docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository }}:${version}" --raw)
          echo "$manifest"
          for platform in $(cat ./* | cut -d/ -f2 | sort -u); do
            echo "$manifest" | jq -e \
              --arg want "$platform" \
              '.manifests | map(.platform.architecture) | index($want)' > /dev/null \
              || { echo "the published manifest does not name $platform"; exit 1; }
          done

  # Everything a tag should reach beyond GitHub, in its own file so that a
  # release which already happened can still be asked to publish — see the note
  # at the top of `publish-registries.yml`. After `publish`, so that nothing
  # points at release assets that do not exist yet.
  registries:
    needs: publish
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/publish-registries.yml
    with:
      ref: ${{ github.ref_name }}
