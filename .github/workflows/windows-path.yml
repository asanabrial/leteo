name: Windows install PATH

# A probe while #448 is open: does the install/uninstall round trip keep a
# `%VAR%` entry in the user PATH, and does it keep the value's registry type?
# Prints the raw value and its kind before, after install and after uninstall,
# under Windows PowerShell 5.1 and PowerShell 7.
on:
  workflow_dispatch:
  push:
    branches: ["issue-448-*"]

jobs:
  path:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --locked

      - name: Assemble an archive the installer can fetch
        shell: pwsh
        run: |
          $version = 'v0.0.0-path-probe'
          $package = "leteo-$version-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force "dist/$package" | Out-Null
          Copy-Item target/debug/leteo.exe "dist/$package/leteo.exe"
          Copy-Item scripts/uninstall.ps1 "dist/$package/uninstall.ps1"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip" -Force
          $hash = (Get-FileHash "dist/$package.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $package.zip" | Set-Content -Encoding ascii "dist/SHA256SUMS"
          Get-Content "dist/SHA256SUMS"

      - name: Serve the archive
        shell: pwsh
        run: |
          Start-Process python -ArgumentList '-m','http.server','8765','--directory','dist' -NoNewWindow
          Start-Sleep -Seconds 2
          (Invoke-WebRequest -Uri 'http://127.0.0.1:8765/SHA256SUMS').StatusCode

      - name: ${{ matrix.shell }} round trip
        shell: ${{ matrix.shell }}
        env:
          LETEO_VERSION: v0.0.0-path-probe
          LETEO_BASE_URL: http://127.0.0.1:8765
          LETEO_INSTALL_DIR: ${{ runner.temp }}\bin
          LETEO_DATA_DIR: ${{ runner.temp }}\data
        run: |
          $ErrorActionPreference = 'Stop'
          $registry = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $true)
          $raw = {
            $registry.GetValue('Path', '<absent>', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          }
          $kind = { $registry.GetValueKind('Path') }
          $current = [Environment]::GetEnvironmentVariable('Path', 'User')

          $seed = if ($current) { "$current;C:\seed;%USERPROFILE%\bin" } else { 'C:\seed;%USERPROFILE%\bin' }
          $registry.SetValue('Path', $seed, [Microsoft.Win32.RegistryValueKind]::ExpandString)
          Write-Host "engine            : $($PSVersionTable.PSVersion)"
          Write-Host "seeded raw        : $(& $raw)"
          Write-Host "seeded kind       : $(& $kind)"

          & "$PWD\scripts\install.ps1"
          Write-Host "after install raw : $(& $raw)"
          Write-Host "after install kind: $(& $kind)"
          Write-Host "GetEnvironmentVariable: $([Environment]::GetEnvironmentVariable('Path', 'User'))"

          & "$env:LETEO_INSTALL_DIR\uninstall.ps1" -Yes
          Write-Host "after uninstall raw : $(& $raw)"
          Write-Host "after uninstall kind: $(& $kind)"

          $after = & $raw
          if ($after -notmatch [regex]::Escape('%USERPROFILE%\bin')) {
            Write-Host "::error::%USERPROFILE%\\bin left the user PATH"
          }
          if ($after -notmatch [regex]::Escape('C:\seed')) {
            Write-Host "::error::C:\seed left the user PATH"
          }
