name: Publish to registries

# The three registries a tag should reach. One entry point, and it is dispatch.
#
# `release.yml` dispatches this after the GitHub release exists, so nothing
# points at assets that are not there yet — the npm wrapper resolves
# `v<version>` against those very assets, and a package published first is a
# package that 404s for the length of a build.
#
# It used to be a `workflow_call`, and that is why v0.2.0 reached no registry
# at all: OIDC names the *calling* workflow, so this file arrived at crates.io
# claiming to be `release.yml` and was refused by name. The trigger is gone
# rather than left beside the dispatch, because a `uses:` added back here would
# fail the same way and take another release to notice. Without it, GitHub
# rejects the `uses:` when the workflow is parsed. See the `registries` job in
# `release.yml` for the trade this makes.
#
# `workflow_dispatch` is also how a release that already happened reaches them.
# v0.1.2 shipped before these jobs existed, and a tag cannot be pushed twice:
# without a way to ask, the only routes left were publishing by hand — which is
# the thing being replaced — or cutting a version whose only content is that
# the last one did not publish. One registry failing while the others succeed
# has the same shape, and it will happen: three services, three ways to be down.
#
# All three authenticate with GitHub's OIDC rather than a stored token. That is
# not only tidier: npm revoked every classic token in November 2025, and a
# long-lived credential in a repository secret is what those revocations were
# about. `id-token: write` lets a job prove which workflow of which repository
# it is, and each registry trades that for a few minutes of access. It is also
# what makes this possible at all — publishing to npm by hand asks for a
# one-time password from an authenticator app, and no workflow has one.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The tag to publish, for example v0.1.2.
        type: string
        required: true

permissions: {}

jobs:
  crates-io:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # Publishing a version that is already there is an error rather than a
      # no-op, and re-running this for a tag whose crate went out is an ordinary
      # thing to do — one registry can fail while the others succeed. So the
      # version is asked about first.
      - name: Publish unless crates.io already has it
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          # Through the environment, not `${{ }}` inside the script. A ref name
          # may hold a quote, a `$` or a backtick — git forbids spaces and
          # `~^:?*[` and little else — and an expression is substituted before
          # bash parses the line, so a tag could run as code in the job that
          # holds the crates.io token. The three `ref:` uses elsewhere in this
          # file are action inputs and never reach a shell; this was the one
          # that did.
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          version="${REF#v}"
          if curl -fsS -H 'user-agent: leteo-release' \
               "https://crates.io/api/v1/crates/leteo/$version" >/dev/null 2>&1; then
            echo "crates.io already has leteo $version"
            exit 0
          fi
          cargo publish --locked

  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      # Trusted publishing needs npm 11.5.1 and Node 22.14 at the least, and
      # asks for the registry to be named here rather than in an .npmrc.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: The versions trusted publishing needs
        run: node --version && npm --version
      # `npm/` and not the repository root: the wrapper is a subdirectory on
      # purpose, kept out of the crate by `exclude` in Cargo.toml.
      - name: Publish unless npm already has it
        working-directory: npm
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if npm view "@asanabrial/leteo@$version" version >/dev/null 2>&1; then
            echo "npm already has @asanabrial/leteo $version"
            exit 0
          fi
          npm publish --access public

  mcp-registry:
    # Last, because it is the only job that reads the other two's work. The
    # registry validates every package `server.json` offers before it accepts
    # the submission, so it asks crates.io and npm whether they hold this
    # version — and all three jobs used to start together. On v0.2.0 it asked
    # crates.io at 21:13:10 for a crate crates.io recorded at 21:14:44 and
    # failed by ninety-four seconds, naming a precondition that was true before
    # anyone could have looked. Both, not just crates.io: the error numbers the
    # packages, and package 1 is the npm one.
    needs: [crates-io, npm]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      # The registry believes this repository owns `io.github.asanabrial/leteo`
      # because the OIDC token says which repository the job is running in.
      - run: ./mcp-publisher login github-oidc
      # The registry rejects a version it already holds, the way crates.io and
      # npm do, and re-running this for a tag that got halfway is the whole
      # reason the workflow can be dispatched by hand. The other two jobs ask
      # first; this one did not, so the second run of v0.1.2 went red on a
      # registry that was already correct.
      - name: Publish unless the registry already has it
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json;print(json.load(open("server.json"))["version"])')"
          # The search returns every version the registry holds, oldest first,
          # so this asks whether ours is among them rather than reading one of
          # them. Taking the first answered 0.1.0 while 0.1.2 was published and
          # flagged latest, which would have republished a duplicate and failed
          # exactly as before.
          held="$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.asanabrial/leteo"             | python3 -c 'import json,sys; print(" ".join(s["server"]["version"] for s in json.load(sys.stdin).get("servers", [])))')"
          echo "registry holds: ${held:-nothing}"
          for one in $held; do
            if [ "$one" = "$version" ]; then
              echo "the registry already has $version"
              exit 0
            fi
          done
          ./mcp-publisher publish
