name: Publish to registries

# The three registries a tag should reach. One entry point, and it is dispatch.
#
# `release.yml` dispatches this after the GitHub release exists, so nothing
# points at assets that are not there yet — the npm wrapper resolves
# `v<version>` against those very assets, and a package published first is a
# package that 404s for the length of a build.
#
# It used to be a `workflow_call`, and that is why v0.2.0 reached no registry
# at all: OIDC names the *calling* workflow, so this file arrived at crates.io
# claiming to be `release.yml` and was refused by name. The trigger is gone
# rather than left beside the dispatch, because a `uses:` added back here would
# fail the same way and take another release to notice. Without it, GitHub
# rejects the `uses:` when the workflow is parsed. See the `registries` job in
# `release.yml` for the trade this makes.
#
# `workflow_dispatch` is also how a release that already happened reaches them.
# v0.1.2 shipped before these jobs existed, and a tag cannot be pushed twice:
# without a way to ask, the only routes left were publishing by hand — which is
# the thing being replaced — or cutting a version whose only content is that
# the last one did not publish. One registry failing while the others succeed
# has the same shape, and it will happen: three services, three ways to be down.
#
# All three authenticate with GitHub's OIDC rather than a stored token. That is
# not only tidier: npm revoked every classic token in November 2025, and a
# long-lived credential in a repository secret is what those revocations were
# about. `id-token: write` lets a job prove which workflow of which repository
# it is, and each registry trades that for a few minutes of access. It is also
# what makes this possible at all — publishing to npm by hand asks for a
# one-time password from an authenticator app, and no workflow has one.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The tag to publish, for example v0.1.2.
        type: string
        required: true

permissions: {}

jobs:
  crates-io:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # Publishing a version that is already there is an error rather than a
      # no-op, and re-running this for a tag whose crate went out is an ordinary
      # thing to do — one registry can fail while the others succeed. So the
      # version is asked about first.
      - name: Publish unless crates.io already has it
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          # Through the environment, not `${{ }}` inside the script. A ref name
          # may hold a quote, a `$` or a backtick — git forbids spaces and
          # `~^:?*[` and little else — and an expression is substituted before
          # bash parses the line, so a tag could run as code in the job that
          # holds the crates.io token. The `ref:` keys elsewhere in this file
          # are action inputs and never reach a shell; this was the one that
          # did.
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          version="${REF#v}"
          if curl -fsS -H 'user-agent: leteo-release' \
               "https://crates.io/api/v1/crates/leteo/$version" >/dev/null 2>&1; then
            echo "crates.io already has leteo $version"
            exit 0
          fi
          cargo publish --locked

  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      # Trusted publishing needs npm 11.5.1 and Node 22.14 at the least, and
      # asks for the registry to be named here rather than in an .npmrc.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: The versions trusted publishing needs
        run: node --version && npm --version
      # `npm/` and not the repository root: the wrapper is a subdirectory on
      # purpose, kept out of the crate by `exclude` in Cargo.toml.
      - name: Publish unless npm already has it
        working-directory: npm
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if npm view "@asanabrial/leteo@$version" version >/dev/null 2>&1; then
            echo "npm already has @asanabrial/leteo $version"
            exit 0
          fi
          npm publish --access public

  # The Pi package, from `plugin/pi`, held to the crate's version like the
  # wrapper. It sits outside the `mcp-registry` job's `needs`, because
  # `server.json` offers no Pi package and the registry asks npm nothing about
  # it.
  npm-pi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # npm attaches a trusted publisher to a package that already exists, so
      # the first version of this one cannot arrive through OIDC at all — it
      # has to be published once by hand, with the owner's second factor. Left
      # to `npm publish`, that case reads as an authentication failure, which
      # sends whoever is looking after the token this workflow deliberately
      # does not have. So a package npm has never heard of fails here by name.
      - name: Publish unless npm already has it
        working-directory: plugin/pi
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "npm already has $name $version"
            exit 0
          fi
          if ! answer="$(npm view "$name" name 2>&1)"; then
            if grep -q E404 <<<"$answer"; then
              echo "::error::npm has never published $name, so no trusted publisher can be attached to it yet. Publish $version once by hand from plugin/pi at this tag, add this workflow as the package's trusted publisher on npmjs.com, and later tags publish here."
            else
              echo "$answer"
            fi
            exit 1
          fi
          npm publish --access public

  # winget takes a new version as a pull request to microsoft/winget-pkgs, from
  # a fork, so this is the one job here that holds a stored credential: no
  # registry trades a GitHub OIDC token for a pull request, and Komac needs a
  # classic token with `public_repo` and `workflow` to open one. `workflow`
  # because Komac branches the fork at winget-pkgs' head, and GitHub refuses a
  # ref that changes workflow files without it: with `public_repo` alone, the
  # first dispatch for v0.4.2 failed on `CreateRef` against a fork 30,435
  # commits behind, whose workflows differed from upstream's.
  # The tap and the Scoop bucket
  # poll for releases from their own repositories and need nothing from here;
  # winget has no such side, and without this job it stayed at 0.1.2 for four
  # releases. A missing secret fails by name rather than skipping, because a
  # quiet skip is how that happened.
  winget:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The workflow's own commit rather than the tag: the manifests describe
      # the package as it is now, and a tag cut before they existed has none.
      - uses: actions/checkout@v6
      - name: Install Komac
        env:
          KOMAC: "2.17.1"
        run: |
          set -euo pipefail
          archive="komac-$KOMAC-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/russellbanks/Komac/releases/download/v$KOMAC"
          curl -fsSLO "$base/$archive"
          # The sums file marks each name `*`, binary mode, which `sha256sum -c`
          # reads. awk compares the name as a string, so its dots match only dots.
          curl -fsSL "$base/SHA256SUMS" |
            awk -v name="$archive" '$2 == name || $2 == "*" name' > komac.sha256
          test -s komac.sha256
          sha256sum -c komac.sha256
          tar -xzf "$archive" komac
      - name: Submit unless winget already has it
        env:
          REF: ${{ inputs.ref }}
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail
          version="${REF#v}"
          # 404 is the only answer that means winget lacks the version. A rate
          # limit or an unreachable API is a question nobody answered, and
          # submitting on it could open a second pull request for a version
          # winget already holds.
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
               "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/a/asanabrial/leteo/$version" || true)"
          case "$status" in
            200) echo "winget-pkgs already has asanabrial.leteo $version"; exit 0 ;;
            404) ;;
            *) echo "::error::Could not ask winget-pkgs whether it holds asanabrial.leteo $version (HTTP $status); dispatch this workflow for $REF again."; exit 1 ;;
          esac
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::The WINGET_TOKEN secret is not set, so asanabrial.leteo $version was not submitted to winget. Add a classic token with the public_repo and workflow scopes from the account that holds the winget-pkgs fork, then dispatch this workflow for $REF."
            exit 1
          fi
          sh tools/winget/render.sh "$REF" manifests
          # Komac exits 0 when it finds nothing it can submit, saying only
          # "No valid packages to submit were found" — seen on 2.17.1 against a
          # manifest set with mismatched versions and against one with an
          # invalid installer type. So success is the pull request it names.
          # `|| true` because under pipefail a failing Komac ended the step on
          # this line, and the lines below that say why never ran.
          ./komac submit manifests --yes 2>&1 | tee submit.log || true
          if grep -q 'CreateRef' submit.log; then
            echo "::error::GitHub refused to create the branch in the winget-pkgs fork. WINGET_TOKEN needs the workflow scope as well as public_repo: the fork's workflow files differ from upstream's, and a ref that changes them needs it."
            exit 1
          fi
          if ! grep -q 'https://github.com/microsoft/winget-pkgs/pull/' submit.log; then
            echo "::error::Komac opened no pull request for asanabrial.leteo $version; its output is above."
            exit 1
          fi

  mcp-registry:
    # Last, because it is the only job that reads the other two's work. The
    # registry validates every package `server.json` offers before it accepts
    # the submission, so it asks crates.io and npm whether they hold this
    # version — and all three jobs used to start together. On v0.2.0 it asked
    # crates.io at 21:13:10 for a crate crates.io recorded at 21:14:44 and
    # failed by ninety-four seconds, naming a precondition that was true before
    # anyone could have looked. Both, not just crates.io: the error numbers the
    # packages, and package 1 is the npm one.
    needs: [crates-io, npm]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      # The registry believes this repository owns `io.github.asanabrial/leteo`
      # because the OIDC token says which repository the job is running in.
      - run: ./mcp-publisher login github-oidc
      # The registry rejects a version it already holds, the way crates.io and
      # npm do, and re-running this for a tag that got halfway is the whole
      # reason the workflow can be dispatched by hand. The other two jobs ask
      # first; this one did not, so the second run of v0.1.2 went red on a
      # registry that was already correct.
      - name: Publish unless the registry already has it
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json;print(json.load(open("server.json"))["version"])')"
          # The search returns every version the registry holds, oldest first,
          # so this asks whether ours is among them rather than reading one of
          # them. Taking the first answered 0.1.0 while 0.1.2 was published and
          # flagged latest, which would have republished a duplicate and failed
          # exactly as before.
          held="$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.asanabrial/leteo"             | python3 -c 'import json,sys; print(" ".join(s["server"]["version"] for s in json.load(sys.stdin).get("servers", [])))')"
          echo "registry holds: ${held:-nothing}"
          for one in $held; do
            if [ "$one" = "$version" ]; then
              echo "the registry already has $version"
              exit 0
            fi
          done
          ./mcp-publisher publish
